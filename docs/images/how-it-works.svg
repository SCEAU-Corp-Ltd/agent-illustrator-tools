<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 152" width="800" height="152" role="img" aria-labelledby="hiw-title hiw-desc" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="hiw-title">How it works</title>
  <desc id="hiw-desc">Four steps: you describe the change, an AI assistant turns it into actions, MCP carries them, Illustrator makes the change.</desc>

  <style>
    .num   { font-size: 9px; letter-spacing: 2px; fill: #9a9a9a; }
    .title { font-size: 18px; font-weight: 600; fill: #0f0f0f; }
    .body  { font-size: 11px; fill: #555555; }
    .rule  { stroke: #0f0f0f; stroke-width: 1.5; }
    .arrow { stroke: #0f0f0f; stroke-width: 1; }
    .head  { fill: #0f0f0f; }

    /* Pulse travelling down the pipeline, one step at a time. */
    @keyframes step-pulse {
      0%, 8%    { fill: #ff9a00; }
      22%, 100% { fill: #9a9a9a; }
    }
    @keyframes arrow-flow {
      0%   { stroke-dashoffset: 24; opacity: .35; }
      50%  { opacity: 1; }
      100% { stroke-dashoffset: 0;  opacity: .35; }
    }
    @keyframes track-sweep {
      0%   { transform: translateX(0);    opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(704px); opacity: 0; }
    }

    .num                { animation: step-pulse 4.8s linear infinite; }
    .s2 .num            { animation-delay: 1.2s; }
    .s3 .num            { animation-delay: 2.4s; }
    .s4 .num            { animation-delay: 3.6s; }

    .arrow              { stroke-dasharray: 4 4; animation: arrow-flow 1.2s linear infinite; }
    .a2                 { animation-delay: 1.2s; }
    .a3                 { animation-delay: 2.4s; }

    .sweep              { animation: track-sweep 4.8s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .num, .arrow, .sweep { animation: none; }
      .arrow { stroke-dasharray: none; opacity: 1; }
      .sweep { opacity: 0; }
    }
  </style>

  <!-- card: keeps the black ink legible on dark backgrounds -->
  <rect x="0.5" y="0.5" width="799" height="151" fill="#f4f4f2" stroke="#dcdcd8" stroke-width="1"/>

  <line class="rule" x1="32" y1="16" x2="768" y2="16"/>

  <g class="s1">
    <text class="num"   x="32" y="42">01</text>
    <text class="title" x="32" y="68">You</text>
    <text class="body"  x="32" y="88">Type what you want,</text>
    <text class="body"  x="32" y="104">in plain language</text>
  </g>
  <g>
    <line class="arrow a1" x1="184" y1="66" x2="204" y2="66"/>
    <polygon class="head" points="204,62 214,66 204,70"/>
  </g>

  <g class="s2">
    <text class="num"   x="226" y="42">02</text>
    <text class="title" x="226" y="68">AI assistant</text>
    <text class="body"  x="226" y="88">Claude · Codex · Cursor</text>
    <text class="body"  x="226" y="104">turns words into actions</text>
  </g>
  <g>
    <line class="arrow a2" x1="378" y1="66" x2="398" y2="66"/>
    <polygon class="head" points="398,62 408,66 398,70"/>
  </g>

  <g class="s3">
    <text class="num"   x="420" y="42">03</text>
    <text class="title" x="420" y="68">MCP</text>
    <text class="body"  x="420" y="88">Adobe's secure</text>
    <text class="body"  x="420" y="104">connection layer</text>
  </g>
  <g>
    <line class="arrow a3" x1="572" y1="66" x2="592" y2="66"/>
    <polygon class="head" points="592,62 602,66 592,70"/>
  </g>

  <g class="s4">
    <text class="num"   x="614" y="42">04</text>
    <text class="title" x="614" y="68">Illustrator</text>
    <text class="body"  x="614" y="88">makes the</text>
    <text class="body"  x="614" y="104">change</text>
  </g>

  <line class="rule" x1="32" y1="130" x2="768" y2="130"/>
  <rect class="sweep" x="32" y="128.5" width="64" height="3" fill="#ff9a00"/>
</svg>
