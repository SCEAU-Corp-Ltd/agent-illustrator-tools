<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <!-- top rule -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#0f0f0f" stroke-width="1.5"/>

  <!-- step 01 -->
  <text x="0" y="28" font-size="9" letter-spacing="2" fill="#999">01</text>
  <text x="0" y="54" font-size="18" font-weight="600" fill="#0f0f0f">You</text>
  <text x="0" y="72" font-size="11" fill="#555">Type what you want,</text>
  <text x="0" y="87" font-size="11" fill="#555">in plain language</text>

  <!-- arrow 1 -->
  <line x1="148" y1="52" x2="218" y2="52" stroke="#0f0f0f" stroke-width="1"/>
  <polygon points="218,48 228,52 218,56" fill="#0f0f0f"/>

  <!-- step 02 -->
  <text x="238" y="28" font-size="9" letter-spacing="2" fill="#999">02</text>
  <text x="238" y="54" font-size="18" font-weight="600" fill="#0f0f0f">AI assistant</text>
  <text x="238" y="72" font-size="11" fill="#555">Claude · Codex · Cursor</text>
  <text x="238" y="87" font-size="11" fill="#555">turns words into actions</text>

  <!-- arrow 2 -->
  <line x1="430" y1="52" x2="500" y2="52" stroke="#0f0f0f" stroke-width="1"/>
  <polygon points="500,48 510,52 500,56" fill="#0f0f0f"/>

  <!-- step 03 -->
  <text x="520" y="28" font-size="9" letter-spacing="2" fill="#999">03</text>
  <text x="520" y="54" font-size="18" font-weight="600" fill="#0f0f0f">MCP</text>
  <text x="520" y="72" font-size="11" fill="#555">Adobe's secure</text>
  <text x="520" y="87" font-size="11" fill="#555">connection layer</text>

  <!-- arrow 3 -->
  <line x1="628" y1="52" x2="698" y2="52" stroke="#0f0f0f" stroke-width="1"/>
  <polygon points="698,48 708,52 698,56" fill="#0f0f0f"/>

  <!-- step 04 -->
  <text x="718" y="28" font-size="9" letter-spacing="2" fill="#999">04</text>
  <text x="718" y="54" font-size="18" font-weight="600" fill="#0f0f0f">Illustrator</text>
  <text x="718" y="72" font-size="11" fill="#555">makes the</text>
  <text x="718" y="87" font-size="11" fill="#555">change</text>

  <!-- bottom rule -->
  <line x1="0" y1="115" x2="800" y2="115" stroke="#0f0f0f" stroke-width="1.5"/>

</svg>
