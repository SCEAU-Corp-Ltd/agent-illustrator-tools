<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">

  <!-- top rule -->
  <line x1="0" y1="0" x2="800" y2="0" stroke="#0f0f0f" stroke-width="1.5"/>

  <!-- heading -->
  <text x="0" y="34" font-size="9" letter-spacing="2" fill="#999">ILLUSTRATOR (BETA) — PREFERENCES</text>
  <text x="0" y="62" font-size="22" font-weight="600" fill="#0f0f0f">MCP &amp; Tools</text>

  <!-- divider -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#e0e0e0" stroke-width="1"/>

  <!-- checkboxes -->
  <rect x="0" y="98" width="12" height="12" rx="2" fill="none" stroke="#0f0f0f" stroke-width="1.2"/>
  <line x1="2" y1="104" x2="5" y2="108" stroke="#0f0f0f" stroke-width="1.2"/>
  <line x1="5" y1="108" x2="11" y2="100" stroke="#0f0f0f" stroke-width="1.2"/>
  <text x="22" y="110" font-size="13" fill="#0f0f0f">Enable MCP server</text>

  <rect x="0" y="122" width="12" height="12" rx="2" fill="none" stroke="#0f0f0f" stroke-width="1.2"/>
  <line x1="2" y1="128" x2="5" y2="132" stroke="#0f0f0f" stroke-width="1.2"/>
  <line x1="5" y1="132" x2="11" y2="124" stroke="#0f0f0f" stroke-width="1.2"/>
  <text x="22" y="134" font-size="13" fill="#0f0f0f">Show MCP &amp; Tools status on application header</text>

  <!-- divider -->
  <line x1="0" y1="154" x2="800" y2="154" stroke="#e0e0e0" stroke-width="1"/>

  <text x="0" y="176" font-size="9" letter-spacing="2" fill="#999">CONNECT TO EXTERNAL TOOLS</text>

  <!-- rows -->

  <!-- Cursor -->
  <text x="0" y="210" font-size="13" font-weight="500" fill="#0f0f0f">Cursor</text>
  <rect x="160" y="195" width="80" height="24" rx="4" fill="none" stroke="#0f0f0f" stroke-width="1"/>
  <text x="200" y="212" text-anchor="middle" font-size="12" fill="#0f0f0f">Connect</text>

  <!-- divider -->
  <line x1="0" y1="228" x2="800" y2="228" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Claude Code -->
  <text x="0" y="252" font-size="13" font-weight="500" fill="#0f0f0f">Claude Code</text>
  <rect x="160" y="237" width="560" height="24" rx="4" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="176" y="254" font-size="11" fill="#999">claude mcp add --transport http --header "Authorization: Bearer  ████████████████</text>

  <!-- divider -->
  <line x1="0" y1="272" x2="800" y2="272" stroke="#f0f0f0" stroke-width="1"/>

  <!-- Codex -->
  <text x="0" y="296" font-size="13" font-weight="500" fill="#0f0f0f">Codex</text>
  <rect x="160" y="281" width="560" height="24" rx="4" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="1"/>
  <text x="176" y="298" font-size="11" fill="#999">export ADOBE_ILLUSTRATOR_MCP_BEARER_TOKEN=████████████████████████</text>

  <!-- bottom rule -->
  <line x1="0" y1="325" x2="800" y2="325" stroke="#0f0f0f" stroke-width="1.5"/>

  <!-- caption -->
  <text x="0" y="340" font-size="9" letter-spacing="1" fill="#999">TOKEN FIELDS ARE PRIVATE — NEVER SHARE OR COMMIT THEM</text>

</svg>
