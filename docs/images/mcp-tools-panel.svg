<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Illustration of the Illustrator Preferences MCP and Tools panel, with the token fields hidden.">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="26" text-anchor="middle" font-size="14" fill="#888">Illustration — Preferences › MCP &amp; Tools (your tokens stay hidden)</text>

  <!-- dialog -->
  <rect x="20" y="44" width="860" height="496" rx="10" fill="#3A3A3A" stroke="#222" stroke-width="1"/>
  <rect x="20" y="44" width="860" height="30" rx="10" fill="#2B2B2B"/>
  <text x="450" y="64" text-anchor="middle" font-size="13" fill="#cfcfcf">Preferences</text>

  <!-- sidebar -->
  <rect x="36" y="92" width="190" height="430" rx="6" fill="#333" stroke="#4d4d4d"/>
  <g font-size="12.5" fill="#bdbdbd">
    <text x="50" y="120">General</text>
    <text x="50" y="146">Type</text>
    <text x="50" y="172">Units</text>
    <text x="50" y="198">Guides &amp; Grid</text>
    <text x="50" y="224">User Interface</text>
    <text x="50" y="250">Performance</text>
    <text x="50" y="276">File Handling</text>
    <text x="50" y="302">Devices</text>
  </g>
  <rect x="36" y="318" width="190" height="28" fill="#5A6B7A"/>
  <text x="50" y="337" font-size="12.5" font-weight="700" fill="#ffffff">MCP &amp; Tools</text>

  <!-- panel content -->
  <text x="252" y="118" font-size="17" font-weight="700" fill="#e8e8e8">MCP &amp; Tools</text>
  <text x="252" y="142" font-size="12.5" fill="#9a9a9a">Connect client MCP with Illustrator</text>

  <!-- checkboxes -->
  <rect x="252" y="158" width="15" height="15" rx="3" fill="#4a90d9"/>
  <path d="M255 165 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="278" y="171" font-size="13" fill="#e0e0e0">Enable MCP server</text>

  <rect x="252" y="184" width="15" height="15" rx="3" fill="#4a90d9"/>
  <path d="M255 191 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/>
  <text x="278" y="197" font-size="13" fill="#e0e0e0">Show MCP &amp; Tools status on application header</text>

  <!-- connect group -->
  <rect x="252" y="216" width="600" height="232" rx="8" fill="#363636" stroke="#4d4d4d"/>
  <text x="270" y="240" font-size="13.5" font-weight="600" fill="#d8d8d8">Connect to external tools</text>
  <text x="270" y="262" font-size="11.5" fill="#9a9a9a">Copy the server URL and paste it into your MCP client's configuration</text>

  <!-- Cursor row -->
  <text x="270" y="294" font-size="12.5" fill="#c8c8c8">Cursor</text>
  <rect x="360" y="280" width="86" height="22" rx="5" fill="#5a5a5a" stroke="#6f6f6f"/>
  <text x="403" y="295" text-anchor="middle" font-size="12" fill="#fff">Connect</text>

  <!-- Claude Code row (redacted) -->
  <text x="270" y="326" font-size="12.5" fill="#c8c8c8">Claude Code</text>
  <rect x="360" y="312" width="430" height="22" rx="4" fill="#2c2c2c" stroke="#555"/>
  <rect x="364" y="315" width="422" height="16" rx="3" fill="#1f1f1f"/>
  <text x="575" y="327" text-anchor="middle" font-size="11" fill="#e6a23c">•••••••  hidden — your private token  •••••••</text>

  <!-- Codex row (redacted) -->
  <text x="270" y="358" font-size="12.5" fill="#c8c8c8">Codex</text>
  <rect x="360" y="344" width="430" height="22" rx="4" fill="#2c2c2c" stroke="#555"/>
  <rect x="364" y="347" width="422" height="16" rx="3" fill="#1f1f1f"/>
  <text x="575" y="359" text-anchor="middle" font-size="11" fill="#e6a23c">•••••••  hidden — your private token  •••••••</text>

  <!-- Others row -->
  <text x="270" y="390" font-size="12.5" fill="#c8c8c8">Others</text>
  <rect x="360" y="376" width="300" height="22" rx="4" fill="#2c2c2c" stroke="#555"/>
  <text x="372" y="391" font-size="11.5" fill="#bdbdbd">http://localhost:…/v1/mcp</text>
  <rect x="668" y="376" width="84" height="22" rx="5" fill="#5a5a5a" stroke="#6f6f6f"/>
  <text x="710" y="391" text-anchor="middle" font-size="11.5" fill="#fff">Copy URL</text>
  <rect x="758" y="376" width="84" height="22" rx="5" fill="#5a5a5a" stroke="#6f6f6f"/>
  <text x="800" y="391" text-anchor="middle" font-size="11.5" fill="#fff">Copy key</text>

  <!-- reconnect -->
  <rect x="270" y="412" width="92" height="22" rx="5" fill="#5a5a5a" stroke="#6f6f6f"/>
  <text x="316" y="427" text-anchor="middle" font-size="11.5" fill="#fff">Reconnect</text>

  <text x="252" y="478" font-size="12.5" fill="#7fb0e0" text-decoration="underline">View Instructions</text>
</svg>
